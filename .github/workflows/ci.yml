name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - name: Dependency policy
        run: |
          pnpm check:dependency-policy
          pnpm test:dependency-guardrails
      - name: Public content scrub
        run: pnpm check:public-content
      - name: Cross-package version consistency
        run: pnpm syncpack:list
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck tests
        run: pnpm typecheck:tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - name: Test
        run: pnpm test --exclude=@orcaops/cli
      - name: CLI tests + coverage thresholds
        run: pnpm test --coverage --only=@orcaops/cli
      - name: Task Review PTY (whole-App keyboard/mouse, 80/110/160)
        if: always()
        run: pnpm --filter @orcaops/watch test:pty
      - name: Task Review 10 MiB production cap benchmark
        if: always()
        run: pnpm --filter @orcaops/watch perf:review-cap

  # Every release artifact from one host: only a mac can re-sign and verify the
  # darwin executables, and Bun cross-compiles the linux targets from there.
  watch-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'
      # Cross-compiling downloads one Bun runtime per target; keep them between runs.
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-targets-${{ hashFiles('.bun-version') }}
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Compile the Watch UI for every platform
        run: pnpm compile
      - name: Stage the platform packages
        run: SKIP_COMPILE=1 pnpm release:watch-platforms
      - name: Build the CLI tarball
        run: SKIP_BUILD=1 SKIP_GATE=1 pnpm release:cli
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            dist-release/
            build/cli-dist/staging/

  # The release as a user gets it: installed through a registry of the packed
  # artifacts, on hosts that never heard of Bun, on both Node lines.
  install-smoke:
    needs: watch-compile
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-15 ]
        node: [ 22, 24 ]
        include:
          - os: ubuntu-24.04-arm
            node: 22
          - os: macos-15-intel
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
      - name: Install the release through a local registry and launch Watch
        run: SKIP_BUILD=1 pnpm install:loop --with-watch --no-bun

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Detect dependency-input changes
        id: deps
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The checked-out ref IS the comparison head: the merge commit on a
          # pull_request, the pushed head otherwise.
          head="$(git rev-parse HEAD)"
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="" ;;
          esac

          if [ -z "$base" ]; then
            echo "$EVENT_NAME has no comparison base — auditing unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A branch-creation push reports an all-zero base. Skip the fetch —
          # there is nothing to fetch — and let the detector force the audit.
          case "$base" in
            *[!0]*)
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$base"
              fi
              ;;
          esac
          node scripts/dependency-files-changed.mjs "$base" "$head"
      - name: Production dependency audit
        if: steps.deps.outputs.changed == 'true'
        run: pnpm audit:prod:ci --result-file "${{ runner.temp }}/audit-result.json"
          --github-summary

  check:
    runs-on: ubuntu-latest
    needs: [ lint, typecheck, test, watch-compile, install-smoke, audit ]
    if: always()
    steps:
      - name: Verify all CI legs succeeded
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WATCH_COMPILE_RESULT: ${{ needs.watch-compile.result }}
          INSTALL_SMOKE_RESULT: ${{ needs.install-smoke.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          echo "lint=$LINT_RESULT typecheck=$TYPECHECK_RESULT test=$TEST_RESULT watch-compile=$WATCH_COMPILE_RESULT install-smoke=$INSTALL_SMOKE_RESULT audit=$AUDIT_RESULT"
          if [ "$LINT_RESULT" != "success" ] || [ "$TYPECHECK_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ] || [ "$WATCH_COMPILE_RESULT" != "success" ] || [ "$INSTALL_SMOKE_RESULT" != "success" ] || [ "$AUDIT_RESULT" != "success" ]; then
            echo "::error::one or more CI legs failed"
            exit 1
          fi
