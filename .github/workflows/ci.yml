name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review runs the legs a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      compile-runner: ${{ steps.gate.outputs.compile-runner }}
      smoke-matrix: ${{ steps.gate.outputs.smoke-matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Decide the release matrix
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read live, not from the event payload: a re-run replays the payload
          # it started with, so a label added afterwards would never be seen.
          if [ -n "$PR_NUMBER" ]; then
            PR_LABELS="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.labels[].name]')"
            export PR_LABELS
          fi
          node scripts/ci-gate.mjs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ github.job }}-${{ runner.os }}-
      - name: Dependency policy
        run: |
          pnpm check:dependency-policy
          pnpm test:dependency-guardrails
      - name: Public content scrub
        run: pnpm check:public-content
      - name: Cross-package version consistency
        run: pnpm syncpack:list
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ github.job }}-${{ runner.os }}-
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck tests
        run: pnpm typecheck:tests

  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ github.job }}-${{ runner.os }}-
      - name: Test
        run: pnpm test --exclude=@orcaops/cli --exclude=@orcaops/storage --exclude=@orcaops/review-engine --exclude=@orcaops/core --exclude=@orcaops/history-convert
      - name: Save successful test cache
        if: steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
      - name: Task Review PTY (whole-App keyboard/mouse, 80/110/160)
        if: always()
        run: pnpm exec turbo run test:pty --filter=@orcaops/watch
      - name: Task Review 10 MiB production cap benchmark
        if: always()
        run: pnpm exec turbo run perf:review-cap --filter=@orcaops/watch

  test-heavy:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [storage, review-engine, core, history-convert]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Legacy conversion provenance tests read their pinned original commit.
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.package }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ github.job }}-${{ matrix.package }}-${{ runner.os }}-
      - name: Test package
        run: pnpm test --only=@orcaops/${{ matrix.package }}

  test-cli:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ github.job }}-${{ matrix.shard }}-${{ runner.os }}-
      - name: CLI tests with coverage
        run: pnpm test --coverage --only=@orcaops/cli --config=vitest.shard.config.ts --shard=${{ matrix.shard }}/8 --reporter=blob
      - name: Upload test and coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-report-${{ matrix.shard }}
          path: apps/orcaops-cli/.vitest-reports/blob-${{ matrix.shard }}-8.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    needs: test-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Download every CLI shard report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-report-*
          path: apps/orcaops-cli/.vitest-reports
          merge-multiple: true
      - name: Verify every CLI shard report
        run: |
          set -euo pipefail
          for shard in 1 2 3 4 5 6 7 8; do
            test -s "apps/orcaops-cli/.vitest-reports/blob-$shard-8.json"
          done
      - name: Enforce merged CLI coverage thresholds
        run: pnpm --filter @orcaops/cli exec vitest --merge-reports --coverage

  # Bun cross-compiles every platform from any host, but Darwin executables are
  # re-signed only on a Mac, so the macOS runner is used only when the release
  # matrix includes macOS legs.
  watch-compile:
    needs: changes
    runs-on: ${{ needs.changes.outputs.compile-runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: '.bun-version'
      # Cross-compiling downloads one Bun runtime per target; keep them between runs.
      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-targets-${{ runner.os }}-${{ hashFiles('.bun-version') }}
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Compile the Watch UI for every platform
        run: pnpm compile
      - name: Stage the platform packages
        run: SKIP_COMPILE=1 pnpm release:watch-platforms
      - name: Build the CLI tarball
        run: SKIP_BUILD=1 SKIP_GATE=1 pnpm release:cli
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            dist-release/
            build/cli-dist/staging/

  # The release as a user gets it: installed through a registry of the packed
  # artifacts, on hosts that never heard of Bun, on both Node lines.
  install-smoke:
    needs: [changes, watch-compile]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.smoke-matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
      - name: Install the release through a local registry and launch Watch
        run: SKIP_BUILD=1 pnpm install:loop --with-watch --no-bun

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Detect dependency-input changes
        id: deps
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The checked-out ref IS the comparison head: the merge commit on a
          # pull_request, the pushed head otherwise.
          head="$(git rev-parse HEAD)"
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE_SHA" ;;
            *) base="" ;;
          esac

          if [ -z "$base" ]; then
            echo "$EVENT_NAME has no comparison base — auditing unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A branch-creation push reports an all-zero base. Skip the fetch —
          # there is nothing to fetch — and let the detector force the audit.
          case "$base" in
            *[!0]*)
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$base"
              fi
              ;;
          esac
          node scripts/dependency-files-changed.mjs "$base" "$head"
      - name: Production dependency audit
        if: steps.deps.outputs.changed == 'true'
        run: pnpm audit:prod:ci --result-file "${{ runner.temp }}/audit-result.json" --github-summary

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        changes,
        lint,
        typecheck,
        test,
        test-heavy,
        test-cli,
        coverage,
        watch-compile,
        install-smoke,
        audit,
      ]
    # A draft skips the expensive legs, so there is nothing to certify yet.
    if: ${{ always() && !github.event.pull_request.draft }}
    steps:
      - name: Verify all CI legs succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          HEAVY_TEST_RESULT: ${{ needs.test-heavy.result }}
          CLI_TEST_RESULT: ${{ needs.test-cli.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          WATCH_COMPILE_RESULT: ${{ needs.watch-compile.result }}
          INSTALL_SMOKE_RESULT: ${{ needs.install-smoke.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT lint=$LINT_RESULT typecheck=$TYPECHECK_RESULT test=$TEST_RESULT test-heavy=$HEAVY_TEST_RESULT test-cli=$CLI_TEST_RESULT coverage=$COVERAGE_RESULT watch-compile=$WATCH_COMPILE_RESULT install-smoke=$INSTALL_SMOKE_RESULT audit=$AUDIT_RESULT"
          if [ "$CHANGES_RESULT" != "success" ] || [ "$LINT_RESULT" != "success" ] || [ "$TYPECHECK_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ] || [ "$HEAVY_TEST_RESULT" != "success" ] || [ "$CLI_TEST_RESULT" != "success" ] || [ "$COVERAGE_RESULT" != "success" ] || [ "$WATCH_COMPILE_RESULT" != "success" ] || [ "$INSTALL_SMOKE_RESULT" != "success" ] || [ "$AUDIT_RESULT" != "success" ]; then
            echo "::error::one or more CI legs failed"
            exit 1
          fi
