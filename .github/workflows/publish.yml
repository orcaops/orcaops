name: Publish @orcaops/cli

# Publishes via npm OIDC trusted publishing, so there is no token to store.
# Three things a human must do before the first run: create the @orcaops org
# and @orcaops/cli on npm; configure trusted publishing for that package naming
# orcaops/orcaops and this file, without which npm rejects the exchange; and add
# protection rules to the npm-publish environment, which GitHub creates with
# none.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a publish midway; npm is not transactional.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A fork guard only. The private repository is also orcaops/orcaops, so this
    # is true there too; what refuses a publish from it is the withheld-entries
    # check inside `pnpm qualify:public-release`.
    if: github.repository == 'orcaops/orcaops'
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      # Nothing here ships the watch binary, but `pnpm build` is unfiltered and
      # builds it under Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - run: pnpm install --frozen-lockfile

      # Newer than Node 22 bundles; pinned so a publish reproduces from the log.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.6.2

      - name: Check the tag matches the CLI version
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/orcaops-cli/package.json').version")"
          if [ "$TAG_REF" != "v${version}" ]; then
            echo "::error::tag ${TAG_REF} does not match apps/orcaops-cli version ${version}"
            exit 1
          fi
          echo "publishing ${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Qualify the public tree
        run: pnpm qualify:public-release

      - name: Build the release tarball
        run: pnpm release:cli

      - name: Verify the artifact is publishable
        run: node scripts/verify-publishable.mjs build/cli-dist/staging

      # From inside staging: it is the only form carrying the bundled deps.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        working-directory: build/cli-dist/staging

      - name: Record what was published
        run: |
          {
            echo "### Published \`@orcaops/cli@${VERSION}\`"
            echo
            echo "- tag: \`${{ github.ref_name }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- provenance: attested via OIDC trusted publishing"
          } >> "$GITHUB_STEP_SUMMARY"
