name: Publish @orcaops/cli

# Publishes via npm OIDC trusted publishing, so there is no token to store.
# Three things a human must do before the first run: create the @orcaops org
# and @orcaops/cli on npm; configure trusted publishing for that package naming
# orcaops/orcaops and this file, without which npm rejects the exchange; and add
# protection rules to the npm-publish environment, which GitHub creates with
# none.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a publish midway; npm is not transactional.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A fork guard only. The private repository is also orcaops/orcaops, so this
    # is true there too; what refuses a publish from it is the withheld-entries
    # check inside `pnpm qualify:public-release`.
    if: github.repository == 'orcaops/orcaops'
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      # Nothing here ships the watch binary, but `pnpm build` is unfiltered and
      # builds it under Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - run: pnpm install --frozen-lockfile

      # Newer than Node 22 bundles; pinned so a publish reproduces from the log.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.6.2

      - name: Check the tag matches the CLI version
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/orcaops-cli/package.json').version")"
          if [ "$TAG_REF" != "v${version}" ]; then
            echo "::error::tag ${TAG_REF} does not match apps/orcaops-cli version ${version}"
            exit 1
          fi
          echo "publishing ${version}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Qualify the public tree
        run: pnpm qualify:public-release

      - name: Build the release tarball
        run: pnpm release:cli

      - name: Verify the artifact is publishable
        run: node scripts/verify-publishable.mjs build/cli-dist/staging

      # Derived, never chosen: a candidate published to `latest` is handed to
      # every plain `npm i -g`, and npm has no undo for who already installed.
      - name: Resolve the dist-tag this version publishes under
        run: |
          set -euo pipefail
          tag="$(node --input-type=module -e "
            import { distTagFor } from './scripts/release-channel.mjs';
            process.stdout.write(distTagFor(process.env.VERSION));
          ")"
          echo "publishing ${VERSION} under dist-tag ${tag}"
          echo "DIST_TAG=${tag}" >> "$GITHUB_ENV"

      # From inside staging: it is the only form carrying the bundled deps.
      # Skip-if-present so a run that died after the upload can be re-run and
      # reach the jobs behind it; npm answers a re-publish with a 409.
      - name: Publish to npm with provenance
        working-directory: build/cli-dist/staging
        run: |
          set -euo pipefail
          if [ "$(npm view "@orcaops/cli@${VERSION}" version 2>/dev/null || true)" = "$VERSION" ]; then
            echo "::notice::@orcaops/cli@${VERSION} is already on npm; nothing was uploaded"
            echo "UPLOADED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          npm publish --provenance --access public --tag "$DIST_TAG"
          echo "UPLOADED=true" >> "$GITHUB_ENV"

      - name: Record what was published
        run: |
          {
            echo "### Published \`@orcaops/cli@${VERSION}\`"
            echo
            echo "- tag: \`${{ github.ref_name }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- dist-tag: \`${DIST_TAG}\`"
            echo "- uploaded this run: \`${UPLOADED}\`"
            echo "- provenance: attested via OIDC trusted publishing"
          } >> "$GITHUB_STEP_SUMMARY"

  # The notes are a frozen artifact by now: drafted, leak-linted, and reviewed
  # in the changelog PR before the freeze, then shipped inside the tarball
  # this tag published. Publishing them is mechanical.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Extract this version's section
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_REF#v}"
          # A candidate ships the notes of the version it heads toward, which
          # is what verify-publishable accepts too — so 0.2.0-rc.1 reads the
          # 0.2.0 section rather than demanding one of its own.
          version="${version%%-*}"
          awk -v want="$version" '
            /^## \[?[0-9]+\.[0-9]+\.[0-9]+/ {
              if (seen) exit
              line = $0
              sub(/^## \[?/, "", line)
              sub(/\]?[[:space:]].*$/, "", line)
              if (line == want) { seen = 1; next }
              next
            }
            seen { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_REF" >/dev/null 2>&1; then
            echo "::notice::release ${TAG_REF} already exists; leaving it untouched"
            exit 0
          fi
          flags=(--title "$TAG_REF" --notes-file release-notes.md --verify-tag)
          # A candidate must not sit on the repository front page as Latest.
          case "$TAG_REF" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG_REF" "${flags[@]}"
