schema: orcaops.evaluator/v1
id: revision-rationale-required
phase: post-plan-revision
severity: block
description: >-
  Every plan revision must state *why* the plan changed. The rationale
  is the audit record reviewers read against the per-revision
  `step_lineage` diff — without it, the revision history is a list of
  "what" with no "why." Severity is `block`: an empty or near-empty
  rationale does not fail the revise call — the revision is still recorded —
  but it leaves a blocking violation on the artifact. Default
  `min_length=16` filters out placeholders ("update", "fix", "wip").
on_block_message: |
  The revision was committed, but its rationale is too thin. Revise
  again with a fuller `rationale` describing what scope shifted and
  why (a fresh `idempotency_key`; this records the next revision_n,
  and a passing revision supersedes this violation), or dismiss it
  with `orcaops block dismiss`.
engine:
  kind: command
  command:
    - node
    - ./runtime/revision-rationale-required.js
params_schema:
  type: object
  properties:
    min_length:
      type: integer
      minimum: 1
  required: [min_length]
  additionalProperties: false
params:
  min_length: 16
