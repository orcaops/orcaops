packages:
  - 'apps/*'
  - 'packages/*'

# Seven days, in minutes. Holds newly published releases out of any NEW
# resolution — transitive ones included — so a compromised release has a window
# in which to be caught and yanked. It does not re-resolve versions already in
# the lockfile, and it is a delay, not malware detection. It can also hold back
# a fresh security fix; docs/dependency-policy.md documents the
# one-off bypass. Deliberately no auditConfig.ignoreGhsas/ignoreCves here:
# advisory exceptions live in config/dependency-policy.json and are applied by
# scripts/run-production-audit.mjs, which needs the unfiltered report.
minimumReleaseAge: 10080
# Our own scope is exempt: the delay guards against a compromised third-party
# release, and a package we publish ourselves gains nothing from a week-long
# hold that only blocks workspace development.
minimumReleaseAgeExclude:
  - '@orcaops/*'

# Every OpenTUI platform library, not just the host's: the Watch UI is
# cross-compiled into one executable per platform, and Bun embeds the target's
# libopentui at compile time from the package installed here. Bun binds the
# lookup to process.platform/arch at compile time, so a missing package fails
# the compile, never the runtime. glibc only: OpenTUI 0.1.89 ships no musl build.
supportedArchitectures:
  os: [darwin, linux]
  cpu: [x64, arm64]
  libc: [glibc]

onlyBuiltDependencies:
  # better-sqlite3 is gone from here deliberately: 13.x is N-API and ships its
  # prebuilds in its own tarball, so it has no install script to allow.
  - esbuild

overrides:
  fast-uri: 4.1.3
  '@opentui/core>diff': 8.0.3
  '@opentui/core>jimp': 1.6.1
